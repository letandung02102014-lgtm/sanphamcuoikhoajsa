<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký & Đăng nhập</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <!-- Form Đăng Nhập -->
            <form id="login-form" class="auth-form">
                <h2>Đăng Nhập</h2>
                <div class="input-group">
                    <input type="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Mật khẩu" required>
                </div>
                <button type="submit" class="btn-main">Đăng Nhập</button>
                <p class="switch-text">Chưa có tài khoản? <a href="#" id="show-signup">Đăng ký ngay</a></p>
            </form>

            <!-- Form Đăng Ký -->
            <form id="signup-form" class="auth-form hidden">
                <h2>Đăng Ký</h2>
                <div class="input-group">
                    <input type="text" placeholder="Họ và tên" required>
                </div>
                <div class="input-group">
                    <input type="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Mật khẩu" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Xác nhận mật khẩu" required>
                </div>
                <button type="submit" class="btn-main">Tạo Tài Khoản</button>
                <p class="switch-text">Đã có tài khoản? <a href="#" id="show-login">Đăng nhập</a></p>
            </form>
        </div>
    </div>

    <script>
        // Script nhỏ để chuyển đổi giữa 2 form
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const showSignup = document.getElementById('show-signup');
        const showLogin = document.getElementById('show-login');

        showSignup.onclick = (e) => {
            e.preventDefault();
            loginForm.classList.add('hidden');
            signupForm.classList.remove('hidden');
        };

        showLogin.onclick = (e) => {
            e.preventDefault();
            signupForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
        };
    </script>
</body>
</html>
