<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao diện Đăng nhập & Đăng ký</title>
    <style>
        /* CSS Nội bộ để bạn dễ quản lý */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f2f5; /* Màu nền trung tính */
        }

        .container {
            background: #fff;
            width: 400px;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .form-box h2 {
            font-size: 28px;
            color: #1c1e21;
            text-align: center;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #1877f2;
            box-shadow: 0 0 0 2px #e7f3ff;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #1877f2;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #166fe5;
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            border-top: 1px solid #dadde1;
            padding-top: 20px;
        }

        .footer-link a {
            color: #1877f2;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }

        /* Hiệu ứng ẩn/hiện form */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="login-box" class="form-box">
            <h2>Đăng Nhập</h2>
            <form onsubmit="return handleAuth(event, 'login')">
                <div class="input-group">
                    <input type="text" placeholder="Email hoặc số điện thoại" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Mật khẩu" required>
                </div>
                <button type="submit" class="btn-submit">Đăng Nhập</button>
            </form>
            <div class="footer-link">
                <a href="#" onclick="toggleForm()">Chưa có tài khoản? Đăng ký ngay</a>
            </div>
        </div>

        <div id="register-box" class="form-box hidden">
            <h2>Đăng Ký</h2>
            <form onsubmit="return handleAuth(event, 'register')">
                <div class="input-group">
                    <input type="text" placeholder="Họ và tên" required>
                </div>
                <div class="input-group">
                    <input type="email" placeholder="Địa chỉ Email" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Mật khẩu mới" required>
                </div>
                <button type="submit" class="btn-submit" style="background: #42b72a;">Đăng Ký</button>
            </form>
            <div class="footer-link">
                <a href="#" onclick="toggleForm()">Bạn đã có tài khoản?</a>
            </div>
        </div>
    </div>

    <script>
        // Hàm chuyển đổi giữa Đăng nhập và Đăng ký
