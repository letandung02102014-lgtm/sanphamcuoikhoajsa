<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giao diện Hiện đại</title>
    <style>
      /* CSS PHẦN GIAO DIỆN */
      :root {
        --primary-color: #6e8efb;
        --secondary-color: #a777e3;
      }

      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(
          135deg,
          var(--primary-color),
          var(--secondary-color)
        );
        font-family: "Segoe UI", sans-serif;
      }

      .container {
        position: relative;
        width: 400px;
        background: rgba(255, 255, 255, 0.15); /* Hiệu ứng kính */
        backdrop-filter: blur(10px);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.2);
        overflow: hidden;
      }

      h2 {
        color: #fff;
        text-align: center;
        margin-bottom: 30px;
        letter-spacing: 1px;
      }

      .input-group {
        position: relative;
        margin-bottom: 20px;
      }

      .input-group input {
        width: 100%;
        padding: 12px 15px;
        background: rgba(255, 255, 255, 0.2);
        border: none;
        outline: none;
        border-radius: 30px;
        color: #fff;
        font-size: 16px;
        box-sizing: border-box;
      }

      .input-group input::placeholder {
        color: rgba(255, 255, 255, 0.7);
      }

      .btn-submit {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 30px;
        background: #fff;
        color: var(--primary-color);
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
      }

      .btn-submit:hover {
        transform: scale(1.05);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      .toggle-text {
        color: #fff;
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
      }

      .toggle-text a {
        color: #fff;
        font-weight: bold;
        text-decoration: none;
        border-bottom: 1px solid #fff;
      }

      /* Hiệu ứng ẩn hiện */
      .form-box {
        transition: 0.5s ease-in-out;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Form Đăng Nhập -->
      <div id="login-box" class="form-box">
        <h2>LOGIN</h2>
        <div class="input-group">
          <input type="text" placeholder="Tên đăng nhập" required />
        </div>
        <div class="input-group">
          <input type="password" placeholder="Mật khẩu" required />
        </div>
        <button class="btn-submit">Đăng Nhập</button>
        <p class="toggle-text">
          Mới đến đây?
          <a href="javascript:void(0)" onclick="toggleForm()">Đăng ký ngay</a>
        </p>
      </div>

      <!-- Form Đăng Ký -->
      <div id="signup-box" class="form-box hidden">
        <h2>REGISTER</h2>
        <div class="input-group">
          <input type="text" placeholder="Họ và tên" required />
        </div>
        <div class="input-group">
          <input type="email" placeholder="Email" required />
        </div>
        <div class="input-group">
          <input type="password" placeholder="Mật khẩu" required />
        </div>
        <button class="btn-submit">Tạo Tài Khoản</button>
        <p class="toggle-text">
          Đã có tài khoản?
          <a href="javascript:void(0)" onclick="toggleForm()">Đăng nhập</a>
        </p>
      </div>
    </div>

    <script>
      function toggleForm() {
        const loginBox = document.getElementById("login-box");
        const signupBox = document.getElementById("signup-box");

        loginBox.classList.toggle("hidden");
        signupBox.classList.toggle("hidden");
      }
    </script>
  </body>
</html>
